aug:
  image_aug: true
  masked_language_model: true
backbone: vgg19_bn
cnn:
  hidden: 256
  ks:
  - - 2
    - 2
  - - 2
    - 2
  - - 2
    - 1
  - - 2
    - 1
  - - 1
    - 1
  pretrained: true
  ss:
  - - 2
    - 2
  - - 2
    - 2
  - - 2
    - 1
  - - 2
    - 1
  - - 1
    - 1
dataloader:
  num_workers: 0
  pin_memory: true
dataset:
  data_root: ''
  image_height: 32
  image_max_width: 2048
  image_min_width: 32
  name: combined_handwriting
  train_annotation: d:\orc\train_combined.txt
  valid_annotation: d:\orc\val_combined.txt
device: cuda:0
optimizer:
  max_lr: 0.0003
  pct_start: 0.1
predictor:
  beamsearch: false
pretrain: d:\orc\weights\transformerocr_finetuned.pth
quiet: false
seq_modeling: transformer
trainer:
  batch_size: 4
  checkpoint: d:\orc\checkpoint_hw_pro.pth
  export: d:\orc\weights\handwriting_pro.pth
  iters: 10000
  log: ./train.log
  metrics: null
  print_every: 50
  valid_every: 500
transformer:
  d_model: 256
  dim_feedforward: 2048
  max_seq_length: 1024
  nhead: 8
  num_decoder_layers: 6
  num_encoder_layers: 6
  pos_dropout: 0.1
  trans_dropout: 0.1
